<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Administration — AURA-HIJAB</title><style>body{font-family:Arial,sans-serif;background:#f7f3ef;display:grid;place-items:center;min-height:100vh;margin:0}.card{width:min(420px,90%);background:#fff;padding:34px;border-radius:18px;box-shadow:0 12px 40px #0001}h1{margin-top:0}.muted{color:#666;font-size:13px}label{display:block;margin:16px 0 7px}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ddd;border-radius:10px}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:700;cursor:pointer}.err{background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px}</style></head><body><main class="card"><h1>AURA-HIJAB</h1><p>Connexion à l’espace administrateur</p><form id="login"><label>Adresse e-mail</label><input id="email" type="email" autocomplete="username" required><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password" required><button>Se connecter</button><p id="err" class="err" hidden></p></form><p class="muted">Accès réservé à l’administrateur.</p></main><script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const err=document.getElementById('err');err.hidden=true;try{const r=await fetch('/api/admin-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Connexion impossible');location.href='/admin-dashboard.html'}catch(x){err.textContent=x.message;err.hidden=false}});</script></body></html>
